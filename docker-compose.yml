services:
  postgres:
    image: postgres:16-alpine
    container_name: cerc-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cerc_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cerc_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI Database Manager (Opsional, buka di http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: cerc-lms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
