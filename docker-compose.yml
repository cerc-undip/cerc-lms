services:
  postgres:
    image: postgres:16-alpine
    container_name: cerc-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cerc_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cerc_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI Database Manager (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: cerc-lms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Local S3-compatible Object Storage (API: :9000, Web Console: :9001)
  minio:
    image: minio/minio:latest
    container_name: cerc-lms-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Otomatis membuat bucket 'cerc-lms-bucket' dan set policy publik
  minio-init:
    image: minio/mc:latest
    container_name: cerc-lms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing localminio/cerc-lms-bucket;
      /usr/bin/mc anonymous set download localminio/cerc-lms-bucket;
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
